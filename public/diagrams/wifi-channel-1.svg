<text x="410" y="366" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">ช่อง 1–13 มีศูนย์กลาง 2412–2472 MHz อยู่ในย่าน 2400–2500 MHz ที่ กสทช. กำหนดให้ใช้ทั่วไป</text>
<text x="410" y="388" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="normal">ช่องสีเทาคือช่องที่เลือกแล้วจะซ้อนทับกับช่อง 1, 6 หรือ 11 ที่อยู่ข้างเคียง</text>
