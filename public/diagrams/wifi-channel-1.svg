<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-labelledby="t d" font-family="'Noto Sans Thai','Sarabun',Tahoma,'Segoe UI',sans-serif">
<title id="t">ช่องสัญญาณ Wi-Fi 2.4 GHz และช่องที่ไม่ทับกัน</title><desc id="d">กราฟแสดงช่อง 1 ถึง 13 ของย่าน 2.4 GHz โดยช่อง 1, 6 และ 11 ไม่ซ้อนทับกัน</desc>
<rect x="2" y="2" width="816" height="396" rx="16" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="410" y="38" font-size="20" fill="#1f2937" text-anchor="middle" font-weight="bold">ช่องสัญญาณ Wi-Fi 2.4 GHz: ช่อง 1, 6, 11 ไม่ทับกัน</text>
<text x="410" y="62" font-size="14" fill="#4b5563" text-anchor="middle" font-weight="normal">แต่ละช่องกว้างราว 20–22 MHz แต่ศูนย์กลางห่างกันเพียง 5 MHz จึงซ้อนทับกัน</text>
