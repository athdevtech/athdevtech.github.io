<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="CGNAT ทำให้มี NAT สองชั้นก่อนถึงอินเทอร์เน็ต" font-family="'Noto Sans Thai', Tahoma, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect x="2" y="2" width="816" height="296" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">CGNAT: NAT สองชั้น</text>
<g font-size="14" text-anchor="middle" fill="#0f172a">
<rect x="15" y="100" width="130" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="80" y="128">อุปกรณ์ในบ้าน</text><text x="80" y="150" font-size="12">192.168.1.x</text>
<rect x="190" y="100" width="150" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="265" y="128">Router บ้าน</text><text x="265" y="150" font-size="12">WAN: 100.64.x.x</text>
<rect x="385" y="100" width="200" height="70" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="485" y="128">CGN ของผู้ให้บริการ</text><text x="485" y="150" font-size="12">แชร์ IP สาธารณะให้หลายบ้าน</text>
<rect x="630" y="100" width="170" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="715" y="128">อินเทอร์เน็ต</text><text x="715" y="150" font-size="12">เห็นแค่ IP สาธารณะร่วมกัน</text>
</g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="147" y1="135" x2="188" y2="135"/><line x1="342" y1="135" x2="383" y2="135"/><line x1="587" y1="135" x2="628" y2="135"/>
</g>
<text x="265" y="195" text-anchor="middle" font-size="12" fill="#334155">NAT ชั้นที่ 1 (ในบ้าน)</text>
<text x="485" y="195" text-anchor="middle" font-size="12" fill="#334155">NAT ชั้นที่ 2 (ผู้ให้บริการ)</text>
<text x="410" y="250" text-anchor="middle" font-size="13" fill="#475569">ช่วง 100.64.0.0/10 คือ Shared Address Space ตาม RFC 6598 ที่ใช้ระหว่าง router กับ CGN</text>
<text x="410" y="272" text-anchor="middle" font-size="13" fill="#475569">ตั้ง Port Forwarding ที่ router บ้านอย่างเดียวไม่พอ เพราะคำขอขาเข้าไปไม่ถึง router</text>
</svg>
