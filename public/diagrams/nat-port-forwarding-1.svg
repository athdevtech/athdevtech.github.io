<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="NAT และ Port Forwarding ที่ router บ้าน" font-family="'Noto Sans Thai', Tahoma, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>
<rect x="2" y="2" width="816" height="356" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">NAT และ Port Forwarding ที่ router บ้าน</text>
<g font-size="14" text-anchor="middle" fill="#0f172a">
<rect x="20" y="70" width="170" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="105" y="96">มือถือ / คอมพิวเตอร์</text><text x="105" y="116" font-size="12">192.168.1.10</text>
<rect x="20" y="230" width="170" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="105" y="256">เซิร์ฟเวอร์ / กล้อง / เกม</text><text x="105" y="276" font-size="12">192.168.1.20 พอร์ต 8080</text>
<rect x="320" y="130" width="190" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="415" y="162" font-weight="bold">Router (NAT)</text><text x="415" y="186" font-size="12">ฝั่ง LAN 192.168.1.1</text><text x="415" y="208" font-size="12">ฝั่ง WAN (IP สาธารณะ)</text>
<rect x="640" y="70" width="160" height="60" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="720" y="96">เว็บไซต์</text><text x="720" y="116" font-size="12">ในอินเทอร์เน็ต</text>
<rect x="640" y="230" width="160" height="60" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/><text x="720" y="256">คนนอกบ้านที่ต้องการ</text><text x="720" y="276" font-size="12">เข้าถึงเครื่องในบ้าน</text>
</g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="190" y1="108" x2="340" y2="140"/>
<line x1="510" y1="150" x2="638" y2="108"/>
<line x1="640" y1="260" x2="512" y2="212"/>
<line x1="320" y1="212" x2="192" y2="256"/>
</g>
<g font-size="12" fill="#334155">
<text x="30" y="165">ขาออก: router จำคู่ IP กับพอร์ต</text>
<text x="540" y="172">ส่งออกด้วย IP สาธารณะ</text>
<text x="520" y="205" font-weight="bold">ขาเข้า: มาที่ IP สาธารณะ พอร์ต 8080</text>
<text x="30" y="205">Port Forwarding: เปลี่ยนปลายทาง</text>
<text x="30" y="221">เป็น 192.168.1.20 พอร์ต 8080</text>
</g>
<text x="410" y="332" text-anchor="middle" font-size="13" fill="#475569">ขาเข้าผ่านได้เมื่อมีกฎ Port Forwarding และฝั่ง WAN ของ router ได้ IP สาธารณะ จริง</text>
</svg>
